---
name: E2E Partner Skyline Testnet
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      blade_apex_bridge_ref:
        description: The branch/commit from the Blade Apex Bridge
        type: string
        required: true
      blade_apex_bridge_version:
        description: The Bridge version
        type: string
        required: true
      make_target:
        description: The make target to run
        type: string
        required: true
    outputs:
      workflow_output:
        description: Skyline Testnet Tests output
        value: ${{ jobs.e2e_skyline_testnet.outputs.e2e_skyline_testnet_output_failure }}
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true
      PARTNER_TESTNET_SKYLINE_BRIDGING_API_KEY:
        required: false
      SKYLINE_E2E_TESTNET_WALLET_KEYS_CONTENT:
        required: true

jobs:
  e2e_skyline_testnet:
    name: Run ${{ inputs.make_target }}
    runs-on: ubuntu-latest
    env:
      E2E_TESTS: true
      E2E_LOGS: true
      CI_VERBOSE: true
      PARTNER_TESTNET_SKYLINE_BRIDGING_API_KEY: ${{ secrets.PARTNER_TESTNET_SKYLINE_BRIDGING_API_KEY }}
      E2E_TESTNET_WALLET_KEYS_CONTENT: ${{ secrets.SKYLINE_E2E_TESTNET_WALLET_KEYS_CONTENT }}
      TESTNET_ENV: ${{ inputs.blade_apex_bridge_version }}
    outputs:
      e2e_skyline_testnet_output_failure: ${{ steps.run_e2e_skyline_testnet_failure.outputs.test_output }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.blade_apex_bridge_ref }}
      - name: Install Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{ vars.GOLANG_VERSION }}
          check-latest: true
      - name: Generate OpenSSL certificate
        run: openssl req -x509 -out localhost.crt -keyout localhost.key -newkey rsa:2048 -nodes -sha256 -subj '/CN=localhost' -extensions EXT -config <(printf "[dn]\nCN=localhost\n[req]\ndistinguished_name = dn\n[EXT]\nsubjectAltName=DNS:localhost\nkeyUsage=digitalSignature\nextendedKeyUsage=serverAuth")
      - name: Copy certificate key
        run: sudo cp localhost.key /etc/ssl/private/localhost.key
      - name: Copy certificate itself
        run: sudo cp localhost.crt /usr/local/share/ca-certificates/localhost.crt
      - name: Add certificate to trusted list
        run: sudo update-ca-certificates
      - name: Update certificate key folder permissions
        run: sudo chmod -R 755 /etc/ssl/private
      - name: Update certificate key file permissions
        run: sudo chmod 644 /etc/ssl/private/localhost.key
      - name: Install Cardano tools
        uses: milos-ethernal/cardano-node-action@5a3bce7266cc1500d96e8fa63b3bb97135988482
      - name: Install ogmios
        uses: milos-ethernal/ogmios-action@13e2be0b00da80f26bb8583fa129bd7c08856a49
      - name: Install Cardano tools v11
        uses: milos-ethernal/cardano-node-action@d50edd56c4da9f10533ef99c9bfdb960c879956d
        with:
          tag: '11.0.1'
          sufix: '11'
      - name: Install ogmios for v11
        uses: milos-ethernal/ogmios-action@53cfb88b80a9c3c7891e13ba7f29e4028aea9630
        with:
          tag: 'v6.14.0'
          sufix: '11'
      - name: Checkout apex-bridge repo
        uses: actions/checkout@v4.1.1
        with:
          repository: Ethernal-Tech/apex-bridge
          ref: feat/skyline
      - name: Build apex-bridge
        run: |
          go build -tags testenv
          sudo mv apex-bridge /usr/local/bin/
      - name: Verify apex-bridge executable
        run: apex-bridge --help
      - name: Checkout blade
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.blade_apex_bridge_ref }}
          submodules: recursive
      - name: Check certificate key permissions
        run: ls -l /etc/ssl/private/localhost.key
      - name: Run make ${{ inputs.make_target }}
        run: make ${{ inputs.make_target }}
      - name: Run tests failed
        if: failure()
        id: run_e2e_skyline_testnet_failure
        run: echo "test_output=false" >> $GITHUB_OUTPUT
      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@v4.3.0
        with:
          name: e2e-skyline-logs-${{ inputs.make_target }}
          path: e2e-logs-*/
          retention-days: 30
      - name: Archive e2e bridge data
        if: always()
        uses: actions/upload-artifact@v4.3.0
        with:
          name: e2e-skyline-data-${{ inputs.make_target }}
          path: e2e-bridge-data-tmp-*/
          retention-days: 3
