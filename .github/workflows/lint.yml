---
name: Lint
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      blade_apex_bridge_ref:
        description: The branch/commit from the Blade Apex Bridge
        type: string
        required: true
    outputs:
      workflow_output:
        description: Lint output
        value: ${{ jobs.golangci_lint.outputs.lint_output_failure }}

jobs:
  golangci_lint:
    name: Run Lint
    runs-on: ubuntu-latest
    outputs:
      lint_output_failure: ${{ steps.lint_failure.outputs.lint_output }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.blade_apex_bridge_ref }}
      - name: Install Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{ vars.GOLANG_VERSION }}
          cache: false
      - name: Lint
        uses: golangci/golangci-lint-action@v6.1.1
        with:
          args: --timeout 10m --verbose
      - name: Lint Failed
        if: failure()
        id: lint_failure
        run: echo "lint_output=false" >> $GITHUB_OUTPUT
