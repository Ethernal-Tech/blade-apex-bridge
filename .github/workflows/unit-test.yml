---
name: Unit Tests
on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      blade_apex_bridge_ref:
        description: The branch/commit from the Blade Apex Bridge
        type: string
        required: true
    outputs:
      workflow_output:
        description: Unit Tests output
        value: ${{ jobs.unit_test.outputs.test_output_failure }}

jobs:
  unit_test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    outputs:
      test_output_failure: ${{ steps.run_tests_failure.outputs.test_output }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          ref: ${{ inputs.blade_apex_bridge_ref }}
      - name: Setup Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: ${{ vars.GOLANG_VERSION }}   
      - name: Install Cardano tools
        uses: milos-ethernal/cardano-node-action@5a3bce7266cc1500d96e8fa63b3bb97135988482
      - name: Install Cardano tools v11
        uses: milos-ethernal/cardano-node-action@d50edd56c4da9f10533ef99c9bfdb960c879956d
        with:
          tag: '11.0.1'
          sufix: '11'
      - name: Install Dependencies
        run: ./setup-ci.sh
      - name: Run Go Test
        run: make unit-test
      - name: Run Go Test Failed
        if: failure()
        id: run_tests_failure
        run: echo "test_output=false" >> $GITHUB_OUTPUT
